name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: '7,37 12-23 * * 1-5' }, { cron: '23 3 * * 2-6' }] # fresh prices: every 30 min on market days (UTC), plus a close-out
permissions: { contents: read }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_QUOTE_PROXY_URL: ${{ vars.VITE_QUOTE_PROXY_URL }}
      - run: npm run prices
        env:
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/prices.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  # GitHub's cron trigger is unreliable (often silently skipped), so after every deploy wait ~29 min and dispatch the next one.
  # A newer chain job cancels an older sleeping one, so only one chain is ever alive. The cron above is just a backup restart.
  next:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions: { actions: write }
    concurrency: { group: price-chain, cancel-in-progress: true }
    steps:
      - run: sleep 1740 && gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env: { GH_TOKEN: "${{ github.token }}" }
